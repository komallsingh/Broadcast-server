name: Broadcast Server CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
# test job
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Create test results directory
        run: mkdir -p test-results

      - name: Run tests
        run: npm test -- --json --outputFile=test-results/results.json
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
           name: jest-test-results
           path: test-results/results.json
           if-no-files-found: warn
  
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
  
  deploy:
    needs: [test, lint]
    if: github.event_name=='push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        run: echo "Deploying"

